<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- تدرجات لونية جمالية للشعار -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d64545" />
      <stop offset="100%" stop-color="#d64545" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d64545" />
      <stop offset="100%" stop-color="#d64545" />
    </linearGradient>
  </defs>
  <!-- خلفية اختيارية شفافة (يمكنك إزالتها إذا أردت) -->
  <rect width="100%" height="100%" fill="transparent" />
  <g transform="translate(0, 20)">
    <!-- أيقونة الكتاب والتعليم (في الأعلى) -->
    <g transform="translate(50, -140) scale(2)">
      <!-- صفحة الكتاب اليسرى -->
      <path d="M100 120 C 70 110, 20 120, 10 140 L 10 220 C 20 200, 70 190, 100 200 Z" fill="#b9e3f7" opacity="0.8"/>
      <path d="M100 115 C 65 105, 15 115, 5 135 L 5 215 C 15 195, 65 185, 100 195 Z" fill="none" stroke="#f5c451" stroke-width="8" stroke-linejoin="round"/>
    
      <!-- صفحة الكتاب اليمنى -->
      <path d="M100 120 C 130 110, 180 120, 190 140 L 190 220 C 180 200, 130 190, 100 200 Z" fill="#b9e3f7" opacity="0.8"/>
      <path d="M100 115 C 135 105, 185 115, 195 135 L 195 215 C 185 195, 135 185, 100 195 Z" fill="none" stroke="#f5c451" stroke-width="8" stroke-linejoin="round"/>
      <!-- شعلة المعرفة (في المنتصف) -->
      <path d="M100 60 C 100 60, 125 90, 120 120 C 115 145, 95 150, 100 165 C 105 150, 120 140, 115 125 C 110 110, 90 100, 100 60 Z" fill="url(#accentGrad)" />
      <path d="M100 90 C 105 105, 112 115, 108 128 C 104 135, 96 138, 100 145 C 104 138, 112 135, 108 122 C 105 112, 98 102, 100 90 Z" fill="#ffffff" opacity="0.6"/>
    </g>
    <!-- اسم الموقع بالإنجليزية -->
    <text x="250" y="320" 
          font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="60" 
          font-weight="bold" 
          fill="#f5c451" 
          text-anchor="middle" 
          letter-spacing="2">
      Betadene
    </text>
  </g>
</svg>