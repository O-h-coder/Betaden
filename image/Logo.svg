<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/> <!-- بنفسجي داكن حاد -->
      <stop offset="50%" stop-color="#3B0764"/> <!-- بنفسجي عميق -->
      <stop offset="100%" stop-color="#2E1065"/> <!-- بنفسجي ليلي -->
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="0" height="0" fill="#F8FAFC" rx="32"/>

  <g transform="scale(2) translate(-200, -200)" filter="url(#dropShadow)">
    <g transform="translate(400, 330)">
      
      <path d="M 0 -130                 L 190 -40                 C 205 -32, 205 -18, 190 -10                 L 0 80                 C -10 85, -25 85, -35 80                 L -190 -10                 C -205 -18, -205 -32, -190 -40                 Z" fill="url(#purpleGradient)" style="&#10;    fill: #7d00ff;&#10;"/>

      <path d="M 0 -70                 L 110 -20                 L 0 30                 L -110 -20                 Z" fill="#F8FAFC"/>

      <path d="M 0 -45                 L 65 -15                 L 0 15                 L -65 -15                 Z" fill="url(#accentGradient)" style="&#10;    fill: #311B92;&#10;"/>

      <path d="M -110 35                 L -110 75                 C -110 95, -95 110, -75 110                 L 75 110                 C 95 110, 110 95, 110 75                 L 110 35                 L 65 58                 L 65 70                 C 65 75, 60 80, 55 80                 L -55 80                 C -60 80, -65 75, -65 70                 L -65 58                 Z" fill="url(#purpleGradient)" style="&#10;    fill: #7d00ff;&#10;"/>

      <path d="M 170 -15                 C 180 -10, 185 0, 185 15                 L 185 85                 C 185 92, 179 98, 172 98                 C 165 98, 159 92, 159 85                 L 159 20                 Z" fill="url(#accentGradient)" opacity="0.9" style="&#10;    fill: #311B92;&#10;"/>
      
      <circle cx="172" cy="102" r="10" fill="url(#accentGradient)" style="&#10;    fill: #311B92;&#10;"/>
    </g>
    <text x="400" y="500" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', 'Arial', sans-serif" font-weight="900" font-size="64" fill="#2E1065" letter-spacing="6" style="&#10;    fill: #7d00ff;&#10;">Betaden</text>
  </g>
</svg>